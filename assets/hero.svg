<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Thierry Vinicius — Software Engineer</title>
  <desc id="hero-desc">Backend systems, data models and the interfaces on top. A small graph of connected nodes represents the API, the relational store, the graph store and the client.</desc>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#16203A"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="50%" r="48%">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#4C1D95" stop-opacity=".10"/>
      <stop offset="1" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0F6FC"/>
      <stop offset=".65" stop-color="#C7DBFF"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".6" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="320" rx="16"/></clipPath>

    <!-- graph paths reused by the data pulses -->
    <path id="p1" d="M650 92 L700 172 L792 190 L748 262"/>
    <path id="p2" d="M722 62 L812 102 L792 190 L880 172"/>
    <path id="p3" d="M612 222 L700 172 L812 102 L902 72"/>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .edge { stroke: #24324F; stroke-width: 1.2; fill: none; }
    .edge.hot { stroke: #2B4C8C; }
    .node { fill: #0B1222; stroke: #3B82F6; stroke-width: 1.4; }
    .node.dim { stroke: #2A3A5C; }
    .label { fill: #6B7A94; font-size: 11px; letter-spacing: .04em; }
    .ring { fill: none; stroke: #22D3EE; stroke-width: 1; opacity: .5; transform-origin: 792px 190px; animation: ring 3.2s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; } .pulse { display: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="#05070D"/>
    <rect width="1000" height="320" fill="url(#dots)"/>
    <rect width="1000" height="320" fill="url(#glow)"/>

    <!-- graph: edges -->
    <g>
      <path class="edge" d="M650 92 L722 62"/>
      <path class="edge" d="M722 62 L812 102"/>
      <path class="edge" d="M812 102 L902 72"/>
      <path class="edge" d="M650 92 L700 172"/>
      <path class="edge" d="M722 62 L700 172"/>
      <path class="edge hot" d="M812 102 L792 190"/>
      <path class="edge hot" d="M700 172 L792 190"/>
      <path class="edge hot" d="M792 190 L880 172"/>
      <path class="edge" d="M902 72 L880 172"/>
      <path class="edge" d="M812 102 L880 172"/>
      <path class="edge" d="M700 172 L612 222"/>
      <path class="edge" d="M612 222 L748 262"/>
      <path class="edge hot" d="M792 190 L748 262"/>
      <path class="edge" d="M748 262 L862 256"/>
      <path class="edge" d="M880 172 L862 256"/>
      <path class="edge" d="M902 72 L960 140"/>
      <path class="edge" d="M960 140 L880 172"/>
    </g>

    <!-- graph: nodes -->
    <g>
      <circle class="node dim" cx="650" cy="92" r="4"/>
      <circle class="node" cx="722" cy="62" r="5"/>
      <circle class="node dim" cx="812" cy="102" r="4.5"/>
      <circle class="node dim" cx="902" cy="72" r="4"/>
      <circle class="node dim" cx="700" cy="172" r="4.5"/>
      <circle class="node dim" cx="612" cy="222" r="3.5"/>
      <circle class="node" cx="748" cy="262" r="5"/>
      <circle class="node" cx="880" cy="172" r="5"/>
      <circle class="node dim" cx="862" cy="256" r="3.5"/>
      <circle class="node dim" cx="960" cy="140" r="3.5"/>
      <!-- the API sits at the center of everything -->
      <circle class="ring" cx="792" cy="190" r="9"/>
      <circle cx="792" cy="190" r="9" fill="#0B1222" stroke="#22D3EE" stroke-width="1.6"/>
      <circle cx="792" cy="190" r="3" fill="#22D3EE"/>
    </g>

    <!-- graph: labels -->
    <g class="mono label">
      <text x="806" y="210">api</text>
      <text x="734" y="50">vue</text>
      <text x="738" y="266" text-anchor="end">postgres</text>
      <text x="894" y="168">neo4j</text>
    </g>

    <!-- data pulses travelling through the graph -->
    <g class="pulse">
      <circle r="2.4" fill="#22D3EE">
        <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
      </circle>
      <circle r="2.4" fill="#60A5FA">
        <animateMotion dur="6.5s" begin="1.2s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>
      </circle>
      <circle r="2" fill="#A78BFA">
        <animateMotion dur="7.5s" begin="2.4s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion>
      </circle>
    </g>

    <!-- left: identity -->
    <g>
      <rect x="56" y="58" width="168" height="26" rx="13" fill="#0B1222" stroke="#1E2A44"/>
      <circle cx="74" cy="71" r="3.5" fill="#22D3EE"/>
      <text class="mono" x="86" y="75.5" font-size="12" fill="#9FB3D1" letter-spacing=".08em">SOFTWARE ENGINEER</text>

      <text class="sans" x="54" y="152" font-size="56" font-weight="700" fill="url(#nameFill)" letter-spacing="-.02em">Thierry Vinicius</text>

      <rect x="56" y="172" width="220" height="2" fill="url(#rule)"/>

      <text class="sans" x="56" y="210" font-size="19" fill="#A9B4C6">Backend systems, data models</text>
      <text class="sans" x="56" y="236" font-size="19" fill="#A9B4C6">and the interfaces on top of them.</text>
    </g>

    <!-- bottom: observability-style status line -->
    <g class="mono" font-size="12">
      <line x1="0" y1="282" x2="1000" y2="282" stroke="#111A2E"/>
      <text x="56" y="304" fill="#4B5A75">layer <tspan fill="#9FB3D1">api</tspan></text>
      <text x="156" y="304" fill="#4B5A75">store <tspan fill="#9FB3D1">relational + graph</tspan></text>
      <text x="356" y="304" fill="#4B5A75">client <tspan fill="#9FB3D1">vue</tspan></text>
    </g>
  </g>

  <rect x=".5" y=".5" width="999" height="319" rx="15.5" fill="none" stroke="#1B2436"/>
</svg>
