<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="lab-title lab-desc">
  <title id="lab-title">Lab — side projects and experiments</title>
  <desc id="lab-desc">Experimental track, separate from the main stack: TypeScript on Elysia, running on the Bun runtime. Used for side projects and to explore fast runtimes and end-to-end type safety.</desc>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#120E24" stroke-width="2"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="210" rx="16"/></clipPath>
    <path id="l1" d="M246 134 H284"/>
    <path id="l2" d="M490 134 H528"/>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .box  { fill: #0B0A1A; stroke: #2E2552; stroke-width: 1; }
    .kind { font-size: 11px; fill: #6B5F96; letter-spacing: .12em; }
    .name { font-size: 20px; font-weight: 600; fill: #E6EDF3; }
    .wire { fill: none; stroke: #4C3D8F; stroke-width: 1.4; stroke-dasharray: 3 3; }
    .blink { animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="210" fill="#06050E"/>
    <rect width="1000" height="210" fill="url(#hatch)" opacity=".6"/>

    <!-- header -->
    <text class="mono" x="40" y="46" font-size="12" fill="#A78BFA" letter-spacing=".14em">02 — LAB</text>
    <text class="mono" x="128" y="46" font-size="12" fill="#4A4170">side projects &amp; experiments</text>
    <g class="mono" font-size="11">
      <rect x="862" y="31" width="98" height="22" rx="11" fill="#140F2B" stroke="#3B2F6E"/>
      <circle class="blink" cx="878" cy="42" r="3" fill="#A78BFA"/>
      <text x="888" y="46" fill="#C4B5FD">unstable</text>
    </g>
    <line x1="40" y1="62" x2="960" y2="62" stroke="#17122E"/>

    <!-- modules -->
    <use href="#l1" class="wire"/>
    <use href="#l2" class="wire"/>

    <g>
      <rect class="box" x="40" y="94" width="206" height="80" rx="10"/>
      <text class="mono kind" x="60" y="120">RUNTIME</text>
      <circle cx="224" cy="116" r="4" fill="#FBF0DF"/>
      <text class="sans name" x="60" y="152">Bun</text>
    </g>
    <g>
      <rect class="box" x="284" y="94" width="206" height="80" rx="10"/>
      <text class="mono kind" x="304" y="120">FRAMEWORK</text>
      <circle cx="468" cy="116" r="4" fill="#C084FC"/>
      <text class="sans name" x="304" y="152">Elysia</text>
    </g>
    <g>
      <rect class="box" x="528" y="94" width="206" height="80" rx="10"/>
      <text class="mono kind" x="548" y="120">LANGUAGE</text>
      <circle cx="712" cy="116" r="4" fill="#3178C6"/>
      <text class="sans name" x="548" y="152">TypeScript</text>
    </g>

    <!-- note -->
    <g class="mono" font-size="12" fill="#7C72A6">
      <text x="770" y="116">// exploring fast runtimes</text>
      <text x="770" y="136">// and end-to-end types</text>
      <text x="770" y="156" fill="#4A4170">// not production — yet</text>
    </g>
  </g>

  <rect x=".5" y=".5" width="999" height="209" rx="15.5" fill="none" stroke="#1B2436"/>
</svg>
