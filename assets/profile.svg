<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1160" viewBox="0 0 1000 1160" role="img" aria-labelledby="t d">
  <title id="t">Thierry Vinicius — Software Engineer</title>
  <desc id="d">A single stylized terminal session (illustrative, not executable). Banner: Thierry Vinicius, software engineer. LinkedIn: in/thierry-vinicius. Email: thierry.vinicius@outlook.com. about: builds backend services and data layers with Python and FastAPI and the Vue.js interfaces on top; relational schemas in PostgreSQL, connected data in Neo4j. stack --current: Vue.js client, REST/JSON, FastAPI API, PostgreSQL via SQL, Neo4j via Cypher, on Docker, AWS, Linux and Git. lab --experimental: Bun, Elysia, TypeScript. interests: architecture, data modeling, graphs, automation, APIs, applied AI, data processing.</desc>

  <defs>
    <clipPath id="win"><rect width="1000" height="1160" rx="14"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#111A30"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#120E26" stroke-width="2"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1526"/>
      <stop offset="1" stop-color="#0A101E"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="48%">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#4C1D95" stop-opacity=".08"/>
      <stop offset="1" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="apiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".14"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0F6FC"/>
      <stop offset=".65" stop-color="#C7DBFF"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".6" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#3B82F6"/>
    </marker>

    <!-- hero graph pulse paths -->
    <path id="g1" d="M650 112 L700 192 L792 210 L748 282"/>
    <path id="g2" d="M722 82 L812 122 L792 210 L880 192"/>
    <path id="g3" d="M612 242 L700 192 L722 82 L812 122 L902 92"/>
    <!-- stack diagram wires -->
    <path id="e1" d="M270 605 H370"/>
    <path id="e2" d="M610 605 C 670 605, 670 544, 740 544"/>
    <path id="e3" d="M610 605 C 670 605, 670 666, 740 666"/>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; }
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .p { fill: #A78BFA; } .c { fill: #E6EDF3; } .f { fill: #60A5FA; } .o { fill: #8B98AD; } .k { fill: #22D3EE; }
    .edge { stroke: #24324F; stroke-width: 1.2; fill: none; }
    .edge.hot { stroke: #2B4C8C; }
    .node { fill: #0B1222; stroke: #3B82F6; stroke-width: 1.4; }
    .node.dim { stroke: #2A3A5C; }
    .glabel { fill: #6B7A94; font-size: 11px; letter-spacing: .04em; }
    .box  { fill: #0A1020; stroke: #1E2A44; }
    .lbox { fill: #0B0A1A; stroke: #2E2552; }
    .kind { font-size: 11px; fill: #56647D; letter-spacing: .12em; }
    .lkind { font-size: 11px; fill: #6B5F96; letter-spacing: .12em; }
    .name { font-size: 22px; font-weight: 600; fill: #E6EDF3; }
    .meta { font-size: 12px; fill: #7D8BA3; }
    .wire { fill: none; stroke: #2B4C8C; stroke-width: 1.4; }
    .lwire { fill: none; stroke: #4C3D8F; stroke-width: 1.4; stroke-dasharray: 3 3; }
    .proto { font-size: 11px; fill: #60A5FA; letter-spacing: .06em; }
    .chip rect { fill: #0C1426; stroke: #1F2D4A; }
    .chip text { fill: #9FC5FF; font-size: 13px; }
    .ring { fill: none; stroke: #22D3EE; stroke-width: 1; transform-origin: 792px 210px; animation: ring 3.2s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.6); opacity: 0; } }
    .blink { animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .cursor { animation: cur 1.1s steps(1) infinite; }
    @keyframes cur { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ring, .blink, .cursor { animation: none; } .pulse { display: none; } }
  </style>

  <g clip-path="url(#win)">
    <rect width="1000" height="1160" fill="#05070D"/>
    <rect width="1000" height="1160" fill="url(#dots)"/>
    <rect y="40" width="1000" height="276" fill="url(#glow)"/>

    <!-- ── window chrome ─────────────────────────────── -->
    <rect width="1000" height="40" fill="url(#bar)"/>
    <line x1="0" y1="40" x2="1000" y2="40" stroke="#162038"/>
    <circle cx="24" cy="20" r="6" fill="#2A3550"/>
    <circle cx="44" cy="20" r="6" fill="#2A3550"/>
    <circle cx="64" cy="20" r="6" fill="#22D3EE" opacity=".85"/>
    <text class="mono" x="500" y="25" text-anchor="middle" font-size="12" fill="#56647D">thierry@lab: ~</text>
    <text class="mono" x="976" y="25" text-anchor="end" font-size="12" fill="#3A4763">zsh</text>

    <!-- ── banner ────────────────────────────────────── -->
    <g>
      <path class="edge" d="M650 112 L722 82"/>
      <path class="edge" d="M722 82 L812 122"/>
      <path class="edge" d="M812 122 L902 92"/>
      <path class="edge" d="M650 112 L700 192"/>
      <path class="edge" d="M722 82 L700 192"/>
      <path class="edge hot" d="M812 122 L792 210"/>
      <path class="edge hot" d="M700 192 L792 210"/>
      <path class="edge hot" d="M792 210 L880 192"/>
      <path class="edge" d="M902 92 L880 192"/>
      <path class="edge" d="M812 122 L880 192"/>
      <path class="edge" d="M700 192 L612 242"/>
      <path class="edge" d="M612 242 L748 282"/>
      <path class="edge hot" d="M792 210 L748 282"/>
      <path class="edge" d="M748 282 L862 276"/>
      <path class="edge" d="M880 192 L862 276"/>
      <path class="edge" d="M902 92 L960 160"/>
      <path class="edge" d="M960 160 L880 192"/>

      <circle class="node dim" cx="650" cy="112" r="4"/>
      <circle class="node" cx="722" cy="82" r="5"/>
      <circle class="node dim" cx="812" cy="122" r="4.5"/>
      <circle class="node dim" cx="902" cy="92" r="4"/>
      <circle class="node dim" cx="700" cy="192" r="4.5"/>
      <circle class="node dim" cx="612" cy="242" r="3.5"/>
      <circle class="node" cx="748" cy="282" r="5"/>
      <circle class="node" cx="880" cy="192" r="5"/>
      <circle class="node dim" cx="862" cy="276" r="3.5"/>
      <circle class="node dim" cx="960" cy="160" r="3.5"/>
      <circle class="ring" cx="792" cy="210" r="9"/>
      <circle cx="792" cy="210" r="9" fill="#0B1222" stroke="#22D3EE" stroke-width="1.6"/>
      <circle cx="792" cy="210" r="3" fill="#22D3EE"/>

      <g class="mono glabel">
        <text x="806" y="230">api</text>
        <text x="734" y="70">vue</text>
        <text x="738" y="286" text-anchor="end">postgres</text>
        <text x="894" y="188">neo4j</text>
      </g>

      <g class="pulse">
        <circle r="2.4" fill="#22D3EE"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#g1"/></animateMotion></circle>
        <circle r="2.4" fill="#60A5FA"><animateMotion dur="6.5s" begin="1.2s" repeatCount="indefinite"><mpath href="#g2"/></animateMotion></circle>
        <circle r="2" fill="#A78BFA"><animateMotion dur="7.5s" begin="2.4s" repeatCount="indefinite"><mpath href="#g3"/></animateMotion></circle>
      </g>
    </g>

    <g>
      <rect x="40" y="86" width="182" height="26" rx="13" fill="#0B1222" stroke="#1E2A44"/>
      <circle cx="58" cy="99" r="3.5" fill="#22D3EE"/>
      <text class="mono" x="70" y="103.3" font-size="12" fill="#9FB3D1" textLength="136" lengthAdjust="spacingAndGlyphs">SOFTWARE ENGINEER</text>
      <text class="sans" x="38" y="178" font-size="56" font-weight="700" fill="url(#nameFill)" letter-spacing="-.02em">Thierry Vinicius</text>
      <rect x="40" y="198" width="220" height="2" fill="url(#rule)"/>

      <!-- contact -->
      <g class="mono">
        <rect x="40" y="224" width="20" height="20" rx="5" fill="#0C1426" stroke="#2B4C8C"/>
        <rect x="44.5" y="232" width="2.4" height="8" fill="#60A5FA"/>
        <circle cx="45.7" cy="229" r="1.4" fill="#60A5FA"/>
        <path d="M49 240v-8h2.3v1.1c.6-.9 1.5-1.3 2.5-1.3 1.7 0 2.6 1.1 2.6 3.1V240h-2.3v-4.7c0-1-.4-1.6-1.2-1.6s-1.6.6-1.6 1.7V240z" fill="#60A5FA"/>
        <text x="72" y="239" font-size="15" fill="#E6EDF3">in/thierry-vinicius</text>

        <rect x="40" y="256" width="20" height="20" rx="5" fill="#0C1426" stroke="#1B5A6B"/>
        <rect x="44" y="261" width="12" height="9" rx="1.5" fill="none" stroke="#22D3EE" stroke-width="1.3"/>
        <path d="M44.6 262l5.4 4 5.4-4" fill="none" stroke="#22D3EE" stroke-width="1.3" stroke-linejoin="round"/>
        <text x="72" y="271" font-size="15" fill="#E6EDF3">thierry.vinicius@outlook.com</text>
      </g>
    </g>

    <line x1="40" y1="316" x2="960" y2="316" stroke="#111A2E"/>

    <!-- ── about ─────────────────────────────────────── -->
    <g class="mono">
      <text x="40" y="358"><tspan class="p">❯ </tspan><tspan class="c">cat </tspan><tspan class="f">about.md</tspan></text>
      <text x="60" y="386" class="o">I build backend services and data layers with <tspan class="k">Python</tspan> and <tspan class="k">FastAPI</tspan>,</text>
      <text x="60" y="410" class="o">and the <tspan class="k">Vue.js</tspan> interfaces that sit on top of them.</text>
      <text x="60" y="434" class="o">Relational schemas in <tspan class="k">PostgreSQL</tspan>, connected data in <tspan class="k">Neo4j</tspan>.</text>
    </g>

    <!-- ── stack: current ───────────────────────────── -->
    <g class="mono">
      <text x="40" y="478"><tspan class="p">❯ </tspan><tspan class="c">stack </tspan><tspan class="f">--current</tspan></text>

      <use href="#e1" class="wire" marker-end="url(#arrow)"/>
      <use href="#e2" class="wire" marker-end="url(#arrow)"/>
      <use href="#e3" class="wire" marker-end="url(#arrow)"/>
      <text class="proto" x="320" y="593" text-anchor="middle">REST · JSON</text>
      <text class="proto" x="700" y="533" text-anchor="middle">SQL</text>
      <text class="proto" x="700" y="691" text-anchor="middle">CYPHER</text>
      <g class="pulse">
        <circle r="2.6" fill="#22D3EE"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
        <circle r="2.4" fill="#60A5FA"><animateMotion dur="3.2s" begin=".8s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
        <circle r="2.4" fill="#A78BFA"><animateMotion dur="3.2s" begin="1.8s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
      </g>

      <rect class="box" x="60" y="555" width="210" height="100" rx="10"/>
      <text class="kind" x="82" y="584">CLIENT</text>
      <circle cx="248" cy="580" r="4" fill="#42B883"/>
      <text class="sans name" x="82" y="618">Vue.js</text>
      <text class="meta" x="82" y="642">web interfaces</text>

      <ellipse cx="490" cy="605" rx="190" ry="100" fill="url(#apiGlow)"/>
      <rect x="370" y="543" width="240" height="124" rx="10" fill="#0A1324" stroke="#22D3EE" stroke-opacity=".55"/>
      <text class="kind" x="392" y="572" style="fill:#22D3EE">API</text>
      <circle cx="588" cy="568" r="4" fill="#009688"/>
      <text class="sans name" x="392" y="608" font-size="26">FastAPI</text>
      <text class="meta" x="392" y="634">python · REST services</text>
      <text class="meta" x="392" y="654" style="fill:#4B5A75">pydantic models · openapi</text>

      <rect class="box" x="740" y="500" width="220" height="88" rx="10"/>
      <text class="kind" x="762" y="527">RELATIONAL</text>
      <circle cx="938" cy="523" r="4" fill="#4169E1"/>
      <text class="sans name" x="762" y="558" font-size="20">PostgreSQL</text>
      <text class="meta" x="762" y="579">schemas · sql</text>

      <rect class="box" x="740" y="622" width="220" height="88" rx="10"/>
      <text class="kind" x="762" y="649">GRAPH</text>
      <circle cx="938" cy="645" r="4" fill="#018BFF"/>
      <text class="sans name" x="762" y="680" font-size="20">Neo4j</text>
      <text class="meta" x="762" y="701">nodes · relationships</text>

      <rect x="60" y="728" width="900" height="38" rx="8" fill="#070C18" stroke="#1E2A44" stroke-dasharray="4 4"/>
      <text x="82" y="751" font-size="11" fill="#56647D" letter-spacing=".12em">INFRA</text>
      <text x="150" y="752" font-size="13" fill="#9FB3D1">docker <tspan fill="#2A3A5C">/</tspan> aws <tspan fill="#2A3A5C">/</tspan> linux <tspan fill="#2A3A5C">/</tspan> git</text>
      <text x="938" y="751" font-size="11" fill="#3A4763" text-anchor="end">runs on · ships with</text>
    </g>

    <!-- ── lab: experimental ────────────────────────── -->
    <g class="mono">
      <text x="40" y="816"><tspan class="p">❯ </tspan><tspan class="c">lab </tspan><tspan class="f">--experimental</tspan></text>
      <rect x="226" y="801" width="92" height="22" rx="11" fill="#140F2B" stroke="#3B2F6E"/>
      <circle class="blink" cx="241" cy="812" r="3" fill="#A78BFA"/>
      <text x="251" y="816" font-size="11" fill="#C4B5FD">unstable</text>

      <rect x="60" y="836" width="900" height="92" rx="12" fill="url(#hatch)" stroke="#231C40" stroke-dasharray="4 4"/>
      <path class="lwire" d="M276 882 H306"/>
      <path class="lwire" d="M506 882 H536"/>

      <rect class="lbox" x="76" y="848" width="200" height="68" rx="10"/>
      <text class="lkind" x="94" y="871">RUNTIME</text>
      <circle cx="256" cy="867" r="4" fill="#FBF0DF"/>
      <text class="sans name" x="94" y="902" font-size="20">Bun</text>

      <rect class="lbox" x="306" y="848" width="200" height="68" rx="10"/>
      <text class="lkind" x="324" y="871">FRAMEWORK</text>
      <circle cx="486" cy="867" r="4" fill="#C084FC"/>
      <text class="sans name" x="324" y="902" font-size="20">Elysia</text>

      <rect class="lbox" x="536" y="848" width="200" height="68" rx="10"/>
      <text class="lkind" x="554" y="871">LANGUAGE</text>
      <circle cx="716" cy="867" r="4" fill="#3178C6"/>
      <text class="sans name" x="554" y="902" font-size="20">TypeScript</text>

      <g font-size="12" fill="#7C72A6">
        <text x="764" y="866">// exploring fast runtimes</text>
        <text x="764" y="886">// and end-to-end types</text>
        <text x="764" y="906" fill="#4A4170">// not production — yet</text>
      </g>
    </g>

    <!-- ── interests ─────────────────────────────────── -->
    <g class="mono">
      <text x="40" y="972"><tspan class="p">❯ </tspan><tspan class="c">interests </tspan><tspan class="f">--list</tspan></text>
      <g class="chip">
        <rect x="60"  y="986" width="118" height="28" rx="6"/><text x="119" y="1005" text-anchor="middle">architecture</text>
        <rect x="188" y="986" width="126" height="28" rx="6"/><text x="251" y="1005" text-anchor="middle">data-modeling</text>
        <rect x="324" y="986" width="70"  height="28" rx="6"/><text x="359" y="1005" text-anchor="middle">graphs</text>
        <rect x="404" y="986" width="102" height="28" rx="6"/><text x="455" y="1005" text-anchor="middle">automation</text>
        <rect x="516" y="986" width="54"  height="28" rx="6"/><text x="543" y="1005" text-anchor="middle">apis</text>
        <rect x="580" y="986" width="102" height="28" rx="6"/><text x="631" y="1005" text-anchor="middle">applied-ai</text>
        <rect x="692" y="986" width="140" height="28" rx="6"/><text x="762" y="1005" text-anchor="middle">data-processing</text>
      </g>
    </g>

    <!-- ── projects ──────────────────────────────────── -->
    <g class="mono">
      <text x="40" y="1060"><tspan class="p">❯ </tspan><tspan class="c">projects </tspan><tspan class="f">--explore</tspan></text>
      <text x="60" y="1086" class="o"><tspan class="k">→ </tspan>github.com/Thierryvinicius?tab=repositories</text>
      <text x="40" y="1130"><tspan class="p">❯ </tspan></text>
      <rect class="cursor" x="58" y="1117" width="9" height="17" fill="#22D3EE"/>
    </g>
  </g>

  <rect x=".5" y=".5" width="999" height="1159" rx="13.5" fill="none" stroke="#1B2436"/>
