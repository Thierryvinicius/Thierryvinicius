<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="term-title term-desc">
  <title id="term-title">Terminal — about Thierry Vinicius</title>
  <desc id="term-desc">A stylized terminal session (illustrative, not executable). whoami: Thierry Vinicius, software engineer, Computer Engineering graduate from UCDB. about: builds backend services and data layers with Python and FastAPI, and the Vue.js interfaces on top of them; relational schemas in PostgreSQL, connected data in Neo4j. interests: architecture, data modeling, graphs, automation, APIs, applied AI. projects: github.com/Thierryvinicius repositories.</desc>

  <defs>
    <clipPath id="win"><rect width="1000" height="470" rx="14"/></clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1526"/>
      <stop offset="1" stop-color="#0A101E"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; }
    .p  { fill: #A78BFA; }   /* prompt */
    .c  { fill: #E6EDF3; }   /* command */
    .f  { fill: #60A5FA; }   /* flags */
    .o  { fill: #8B98AD; }   /* output */
    .h  { fill: #E6EDF3; }   /* highlighted output */
    .k  { fill: #22D3EE; }   /* key / accent */
    .chip rect { fill: #0C1426; stroke: #1F2D4A; }
    .chip text { fill: #9FC5FF; font-size: 13px; }
    .l { animation: in .45s ease-out both; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l, .cursor { animation: none; } }
  </style>

  <g clip-path="url(#win)">
    <rect width="1000" height="470" fill="#070B14"/>

    <!-- window chrome -->
    <rect width="1000" height="40" fill="url(#bar)"/>
    <line x1="0" y1="40" x2="1000" y2="40" stroke="#162038"/>
    <circle cx="24" cy="20" r="6" fill="#2A3550"/>
    <circle cx="44" cy="20" r="6" fill="#2A3550"/>
    <circle cx="64" cy="20" r="6" fill="#22D3EE" opacity=".85"/>
    <text class="mono" x="500" y="25" text-anchor="middle" font-size="12" fill="#56647D">thierry@lab: ~</text>
    <text class="mono" x="976" y="25" text-anchor="end" font-size="12" fill="#3A4763">zsh</text>

    <g class="mono">
      <!-- whoami -->
      <g class="l" style="animation-delay:.2s">
        <text x="32" y="80"><tspan class="p">❯ </tspan><tspan class="c">whoami</tspan></text>
      </g>
      <g class="l" style="animation-delay:.55s">
        <text x="52" y="106"><tspan class="h">Thierry Vinicius</tspan><tspan class="o">  ·  software engineer  ·  computer engineering, UCDB</tspan></text>
      </g>

      <!-- about -->
      <g class="l" style="animation-delay:1.1s">
        <text x="32" y="148"><tspan class="p">❯ </tspan><tspan class="c">cat </tspan><tspan class="f">about.md</tspan></text>
      </g>
      <g class="l" style="animation-delay:1.45s">
        <text x="52" y="174" class="o">I build backend services and data layers with <tspan class="k">Python</tspan> and <tspan class="k">FastAPI</tspan>,</text>
        <text x="52" y="198" class="o">and the <tspan class="k">Vue.js</tspan> interfaces that sit on top of them.</text>
        <text x="52" y="222" class="o">Relational schemas in <tspan class="k">PostgreSQL</tspan>, connected data in <tspan class="k">Neo4j</tspan>.</text>
        <text x="52" y="246" class="o">On the side: experimenting with <tspan class="k">Bun</tspan> + <tspan class="k">Elysia</tspan> in <tspan class="k">TypeScript</tspan>.</text>
      </g>

      <!-- interests -->
      <g class="l" style="animation-delay:2.1s">
        <text x="32" y="288"><tspan class="p">❯ </tspan><tspan class="c">interests </tspan><tspan class="f">--list</tspan></text>
      </g>
      <g class="l chip" style="animation-delay:2.45s">
        <rect x="52"  y="302" width="118" height="28" rx="6"/><text x="111" y="321" text-anchor="middle">architecture</text>
        <rect x="180" y="302" width="126" height="28" rx="6"/><text x="243" y="321" text-anchor="middle">data-modeling</text>
        <rect x="316" y="302" width="70"  height="28" rx="6"/><text x="351" y="321" text-anchor="middle">graphs</text>
        <rect x="396" y="302" width="102" height="28" rx="6"/><text x="447" y="321" text-anchor="middle">automation</text>
        <rect x="508" y="302" width="54"  height="28" rx="6"/><text x="535" y="321" text-anchor="middle">apis</text>
        <rect x="572" y="302" width="102" height="28" rx="6"/><text x="623" y="321" text-anchor="middle">applied-ai</text>
        <rect x="684" y="302" width="140" height="28" rx="6"/><text x="754" y="321" text-anchor="middle">data-processing</text>
      </g>

      <!-- projects -->
      <g class="l" style="animation-delay:3.1s">
        <text x="32" y="372"><tspan class="p">❯ </tspan><tspan class="c">projects </tspan><tspan class="f">--explore</tspan></text>
      </g>
      <g class="l" style="animation-delay:3.45s">
        <text x="52" y="398" class="o"><tspan class="k">→ </tspan>github.com/Thierryvinicius?tab=repositories</text>
      </g>

      <!-- idle prompt -->
      <g class="l" style="animation-delay:3.9s">
        <text x="32" y="440"><tspan class="p">❯ </tspan></text>
        <rect class="cursor" x="50" y="427" width="9" height="17" fill="#22D3EE"/>
      </g>
    </g>
  </g>

  <rect x=".5" y=".5" width="999" height="469" rx="13.5" fill="none" stroke="#1B2436"/>
</svg>
